# aml-memory-adapter 评测 API（Agent Memory Challenge Cycle 2）
# 放置路径：/etc/nginx/conf.d/aml-ningxia-tour.top.conf
# 证书：阿里云免费单域名证书（nginx 格式），下载后放 /etc/nginx/ssl/

server {
    listen 80;
    server_name aml.ningxia-tour.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name aml.ningxia-tour.top;
    # nginx 1.24 不支持独立 http2 指令，写在一行（反诈项目踩过的坑）
    # listen 443 ssl http2;  # 若 nginx >= 1.25 可换此行

    ssl_certificate     /etc/nginx/ssl/aml.ningxia-tour.top.pem;
    ssl_certificate_key /etc/nginx/ssl/aml.ningxia-tour.top.key;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 评测平台回调：全量代理到本机 uvicorn
    location / {
        proxy_pass http://127.0.0.1:8600;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Full 评测批量 Add 可能较慢，放宽超时
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
